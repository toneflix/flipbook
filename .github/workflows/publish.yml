name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 0.2.0 or 0.2.0-beta.1
        required: true
        type: string
      tag:
        description: npm dist-tag (defaults to next for pre-releases, otherwise latest)
        required: false
        type: string
      dry-run:
        description: Pack and check without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Resolve version and tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version="${INPUT_VERSION#v}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not a valid version"
            exit 1
          fi

          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            [[ "$version" == *-* ]] && tag=next || tag=latest
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $version as $tag" >> "$GITHUB_STEP_SUMMARY"

      - run: pnpm install --frozen-lockfile

      - name: Set package versions
        run: pnpm -r --filter './packages/*' exec npm pkg set version=${{ steps.release.outputs.version }}

      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: >
          pnpm -r --filter './packages/*' publish
          --access public
          --no-git-checks
          --tag ${{ steps.release.outputs.tag }}
          ${{ inputs.dry-run && '--dry-run' || '' }}
